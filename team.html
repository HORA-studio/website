<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Phòng chung của đội — HORA</title>
<style>
  :root { --bg:#15151e; --panel:#1e1e2a; --panel2:#232330; --line:#33334a; --txt:#eceaf6; --dim:#a5a3bd; --accent:#6c5cff; --danger:#f85149; --ok:#3fb950; }
  * { box-sizing:border-box; }
  html, body { height:100%; overflow-x:hidden; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; touch-action:manipulation; }
  button { background:var(--accent); color:#fff; border:0; border-radius:10px; padding:9px 16px; cursor:pointer; font-size:15px; min-height:44px; }
  button.ghost { background:var(--panel2); color:var(--txt); border:1px solid var(--line); }
  button.danger { background:transparent; color:var(--danger); border:1px solid var(--danger); padding:5px 10px; min-height:32px; font-size:12px; }
  button.small { padding:5px 12px; min-height:34px; font-size:12.5px; }
  input, textarea { background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:16px; width:100%; }
  /* Mobile-first: phong la app full man hinh tren dien thoai */
  .wrap { max-width:880px; margin:0 auto; height:100vh; height:100dvh; display:flex; flex-direction:column; padding:0; }
  #roomView { display:flex; flex-direction:column; flex:1; min-height:0; }
  #roomView[hidden], #loginView[hidden] { display:none !important; }
  #roomView .layout { flex:1; min-height:0; display:flex; align-items:stretch; }
  #roomView .main { flex:1; display:flex; flex-direction:column; min-height:0; min-width:0; position:relative; }
  .daynote { text-align:center; color:var(--dim); font-size:12.5px; padding:4px 2px 2px; }
  #jumpBtn { position:absolute; right:14px; bottom:118px; z-index:5; border-radius:99px; box-shadow:0 4px 14px rgba(0,0,0,.45); padding:8px 14px; min-height:38px; font-size:13.5px; }
  #jumpBtn[hidden] { display:none; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; }
  #roomView .main.card { background:transparent; border:0; border-radius:0; padding:0 10px; }
  h1 { font-size:17px; margin:0; } h2 { font-size:15px; margin:0 0 10px; }
  .dim { color:var(--dim); font-size:12.5px; }
  .err { color:var(--danger); font-size:13px; min-height:18px; }
  #loginView { max-width:420px; margin:6vh 12px 0; }
  #loginView .field { margin-bottom:12px; }
  #loginView h1 { font-size:20px; margin:0 0 4px; }
  header.top { display:flex; align-items:center; gap:10px; padding:10px 12px 8px; border-bottom:1px solid var(--line); }
  header.top .sp { flex:1; }
  header.top button { min-height:38px; padding:6px 12px; font-size:13.5px; }
  .layout { display:flex; gap:14px; align-items:flex-start; }
  .main { flex:1; min-width:0; }
  .side { width:300px; flex:none; display:flex; flex-direction:column; gap:14px; }
  #msgs { flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; display:flex; flex-direction:column; gap:8px; padding:8px 0; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; touch-action:pan-y; }
  .msg { background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:9px 12px; font-size:15.5px; line-height:1.55; min-width:0; max-width:100%; overflow-wrap:anywhere; }
  .msg > div { overflow-wrap:anywhere; min-width:0; }
  .msg .meta { font-size:12.5px; color:var(--dim); margin-bottom:3px; }
  .msg .meta b { color:var(--mc, var(--txt)); font-size:13.5px; }
  .msg .qbar { display:flex; align-items:center; gap:6px; margin-top:7px; flex-wrap:wrap; }
  .chip { font-size:11.5px; padding:2px 9px; border-radius:99px; border:1px solid var(--line); color:var(--dim); }
  .chip.open { color:#f0b429; border-color:#f0b429; }
  .chip.doing { color:#58a6ff; border-color:#58a6ff; }
  .chip.done { color:var(--ok); border-color:var(--ok); }
  .role { font-size:11.5px; padding:1px 8px; border-radius:99px; background:var(--panel2); border:1px solid var(--line); color:var(--dim); }
  .role.reviewer { color:#f0b429; border-color:#f0b429; }
  .role.editor { color:#3fb950; border-color:#3fb950; }
  .role.owner { color:#fff; background:var(--accent); border-color:var(--accent); }
  .mention { color:#58a6ff; }
  .filterbar { display:flex; align-items:center; gap:8px; padding:8px 0 2px; font-size:13px; color:var(--dim); }
  .filterbar input { width:auto; }
  .composer { display:flex; gap:8px; padding:8px 0; background:var(--bg); }
  .composer textarea { resize:none; height:46px; }
  .composer button { flex:none; padding:0 20px; }
  .composer-wrap { position:relative; }
  #mentionPop { position:absolute; left:0; right:0; bottom:100%; margin-bottom:2px; background:var(--panel2); border:1px solid var(--line); border-radius:12px; max-height:264px; overflow-y:auto; overflow-x:hidden; z-index:6; box-shadow:0 -6px 18px rgba(0,0,0,.45); }
  #mentionPop[hidden] { display:none; }
  #mentionPop .mp-item { display:flex; align-items:center; width:100%; min-height:44px; padding:10px 14px; background:transparent; color:var(--txt); border:0; border-bottom:1px solid var(--line); border-radius:0; font-size:15px; text-align:left; cursor:pointer; }
  #mentionPop .mp-item:last-child { border-bottom:0; }
  #mentionPop .mp-item.active { background:var(--accent); color:#fff; }
  .composer-tools { display:flex; gap:8px; align-items:center; padding:0 0 calc(8px + env(safe-area-inset-bottom)); flex-wrap:wrap; font-size:13px; color:var(--dim); }
  .composer-tools select { background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:7px; font-size:16px; }
  .composer-tools input[type=checkbox] { width:auto; }
  .member { display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .member:last-child { border-bottom:0; }
  .dot { width:9px; height:9px; border-radius:50%; background:#55556e; flex:none; }
  .dot.on { background:var(--ok); }
  .member .ops { margin-left:auto; display:flex; gap:6px; }
  .logrow { font-size:12.5px; padding:5px 0; border-bottom:1px solid var(--line); color:var(--dim); }
  .logrow b { color:var(--txt); }
  .codebox { background:#101018; border:1px dashed var(--accent); border-radius:10px; padding:10px 12px; font-size:15px; word-break:break-all; margin-top:8px; }
  @media (min-width: 761px) {
    .wrap { padding:14px 10px calc(14px + env(safe-area-inset-bottom)); }
    h1 { font-size:20px; }
    header.top { padding:0 0 12px; border-bottom:0; }
    header.top button { min-height:40px; font-size:14px; }
    #roomView .main.card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
    #loginView { margin:8vh auto 0; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div id="loginView" class="card" hidden>
    <h1>Phòng chung của đội</h1>
    <p class="dim">Vào bằng tên của bạn và mã riêng được cấp. Mã sai nhiều lần sẽ bị khóa tạm 10 phút.</p>
    <div class="field"><input id="loginName" list="nameList" placeholder="Tên (vd: Rocky)" autocomplete="off">
      <datalist id="nameList"><option>Owner</option><option>Boss</option><option>Rocky</option><option>Juno</option><option>Maren</option><option>Juny</option><option>CaMap</option><option>Hana</option></datalist></div>
    <div class="field"><input id="loginCode" placeholder="Mã vào phòng (vd: XXXX-XXXX-XXXX)" autocomplete="off" style="text-transform:uppercase"></div>
    <div class="err" id="loginErr"></div>
    <button id="loginBtn" style="width:100%">Vào phòng</button>
  </div>

  <div id="roomView" hidden>
    <header class="top">
      <div><h1>Phòng chung của đội</h1><div class="dim" id="meLine"></div></div>
      <div class="sp"></div>
      <button class="ghost" id="logoutBtn">Rời phòng</button>
    </header>
    <div class="layout">
      <div class="main card">
        <div class="filterbar"><label><input type="checkbox" id="onlyOpen"> Chỉ hiện câu hỏi đang mở</label></div>
        <div id="msgs"></div>
        <button id="jumpBtn" hidden>⬇ Tin mới nhất</button>
        <div class="composer-wrap">
          <div id="mentionPop" hidden></div>
          <div class="composer">
            <textarea id="composer" placeholder="Nhắn vào phòng... (Enter để gửi)"></textarea>
            <button id="sendBtn">Gửi</button>
          </div>
        </div>
        <div class="composer-tools">
          <select id="mentionSel"></select>
          <button class="small ghost" id="mentionBtn">Chèn @tên</button>
          <label><input type="checkbox" id="asQuestion"> Đăng dạng câu hỏi (có trạng thái)</label>
        </div>
      </div>
    </div>
  </div>

</div>
<script>
const $ = (id) => document.getElementById(id);
let me = null, lastId = 0, pollTimer = null, msgList = [], memberNames = [], stickBottom = true;
const ROLE_LABEL = { owner: "chủ phòng", reviewer: "reviewer", editor: "editor", member: "thành viên" };
const STATUS_LABEL = { open: "Đang mở", doing: "Đang xử lý", done: "Đã xong" };
// Mau rieng tung thanh vien (bo chot 09:33 13/11): khung tin nhan to mau nhe theo
// nguoi gui — nhin qua la biet ai. Ten la -> bam ra bang mau du phong.
const MEMBER_COLORS = { owner: "#ffd60a", boss: "#8f9bff", rocky: "#56c8f5", juno: "#3ddc97", maren: "#ff8fa3", juny: "#a3d635", camap: "#ff9f43", hana: "#d291ff" };
const FALLBACK_COLORS = ["#fda4af", "#93c5fd", "#6ee7b7", "#fcd34d", "#c4b5fd", "#f9a8d4", "#5eead4", "#fca5a5"];
function memberColor(name) {
  const key = (name || "").trim().toLowerCase();
  if (MEMBER_COLORS[key]) return MEMBER_COLORS[key];
  if (key.includes("camap") || key.includes("mập")) return MEMBER_COLORS.camap;
  let h = 0; for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;
  return FALLBACK_COLORS[h % FALLBACK_COLORS.length];
}
function hexToRgba(hex, a) { const n = parseInt(hex.slice(1), 16); return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")"; }

async function api(path, opts) {
  const r = await fetch(path, { credentials: "same-origin", headers: { "Content-Type": "application/json" }, ...opts });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.message || data.error || ("HTTP " + r.status));
  return data;
}
function fmtTime(s) { if (!s) return "chưa từng vào"; const d = new Date(s.replace(" ", "T") + "Z"); return d.toLocaleString("vi-VN"); }
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

function savedCreds() { try { return JSON.parse(localStorage.getItem("teamCreds") || "null"); } catch { return null; } }
function saveCreds(name, code) { try { localStorage.setItem("teamCreds", JSON.stringify({ name, code })); } catch {} }
function clearCreds() { try { localStorage.removeItem("teamCreds"); } catch {} }
async function tryEnter() {
  try {
    const data = await api("/api/team/members");
    me = data.me; showRoom(data.members);
    return;
  } catch {}
  // Phiên cookie hết hạn → tự vào lại bằng tên+mã đã lưu trên máy này (bố chốt: lưu local).
  const c = savedCreds();
  if (c && c.name && c.code) {
    try {
      const d = await api("/api/team/login", { method: "POST", body: JSON.stringify({ name: c.name, code: c.code }) });
      me = { name: d.name, role: d.role };
      const m = await api("/api/team/members"); showRoom(m.members);
      return;
    } catch { clearCreds(); }
  }
  const c2 = savedCreds();
  if (c2) { $("loginName").value = c2.name || ""; $("loginCode").value = c2.code || ""; }
  showLogin();
}
function showLogin() { $("roomView").hidden = true; $("loginView").hidden = false; }
function showRoom(members) {
  $("loginView").hidden = true; $("roomView").hidden = false;
  $("meLine").textContent = "Bạn là " + me.name + " (" + (ROLE_LABEL[me.role] || "thành viên") + ")";
  renderMembers(members);
  loadMessages(true);
  clearInterval(pollTimer);
  pollTimer = setInterval(() => { loadMessages(false); refreshMembers(); }, 5000);
}
function renderMembers(members) {
  // Panel thành viên đã bỏ khỏi phòng (bố xem ở app ngoài) — hàm này chỉ còn
  // cấp danh sách tên cho ô chèn @mention và tô sáng mention.
  // CHI rebuild khi danh sach thay doi that + giu nguyen lua chon dang chon:
  // truoc day moi 5s poll deu dung lai <select> -> lua chon cua nguoi dung
  // bi nhay ve ten dau tien ("chon xong no tu nhay nguoc lai").
  const names = members.filter(m => !m.revoked).map(m => m.name);
  if (names.join("|") === memberNames.join("|")) return;
  const prev = $("mentionSel").value;
  memberNames = names;
  $("mentionSel").innerHTML = memberNames.map(n => `<option value="${esc(n)}">@${esc(n)}</option>`).join("");
  if (memberNames.includes(prev)) $("mentionSel").value = prev;
  if (mpOpen) updateMentionPop(); // danh sach ten thay doi -> loc lai dropdown @mention dang mo
}
async function refreshMembers() { try { const d = await api("/api/team/members"); renderMembers(d.members); } catch { showLogin(); } }
function highlightMentions(text) {
  let out = esc(text);
  out = out.replace(/@Tất cả mọi người(?![A-Za-z0-9_])/gi, '<span class="mention">@Tất cả mọi người</span>');
  for (const n of memberNames) {
    out = out.replace(new RegExp("@" + n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(?![A-Za-z0-9_])", "gi"), '<span class="mention">@' + n + "</span>");
  }
  return out;
}
// Phong chi hien hoi thoai cua HOM NAY (bo chot 13/11): tin cac ngay truoc tu an,
// ngay moi mo ra la phong gon. Gio tao la UTC -> doi sang ngay local cua may xem.
function isToday(s) {
  if (!s) return false;
  const d = new Date(s.replace(" ", "T") + "Z"), n = new Date();
  return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
}
function updateJumpBtn() { $("jumpBtn").hidden = stickBottom; }
function renderAll() {
  const box = $("msgs");
  const onlyOpen = $("onlyOpen").checked;
  // Giu nguyen vi tri cuon cua nguoi doc: truoc ban nay renderAll luon ep
  // scrollTop = scrollHeight moi 5s (poll) -> dien thoai khong cuon len duoc.
  const prevTop = box.scrollTop, prevH = box.scrollHeight;
  const todayList = msgList.filter(m => isToday(m.created_at));
  const hiddenOld = msgList.length - todayList.length;
  const list = todayList.filter(m => !onlyOpen || (m.kind === "question" && (m.status || "open") !== "done"));
  box.innerHTML = "";
  const note = document.createElement("div");
  note.className = "daynote";
  note.textContent = "Hội thoại hôm nay (" + new Date().toLocaleDateString("vi-VN") + ")" + (hiddenOld > 0 ? " · đã ẩn " + hiddenOld + " tin nhắn của các ngày trước" : "");
  box.appendChild(note);
  for (const m of list) {
    const div = document.createElement("div");
    div.className = "msg" + (m.name === me.name ? " mine" : "");
    const mc = memberColor(m.name);
    div.style.setProperty("--mc", mc);
    div.style.background = hexToRgba(mc, 0.10);
    div.style.borderColor = hexToRgba(mc, 0.38);
    div.style.borderLeft = "3px solid " + mc;
    let html = `<div class="meta"><b>${esc(m.name)}</b> · ${fmtTime(m.created_at)}${m.kind === "question" ? " · <span class='chip " + esc(m.status || "open") + "'>Câu hỏi: " + esc(STATUS_LABEL[m.status || "open"]) + "</span>" : ""}</div><div>${highlightMentions(m.body)}</div>`;
    if (m.kind === "question") {
      const st = m.status || "open";
      html += `<div class="qbar">` +
        (st !== "doing" ? `<button class="small ghost" onclick="setStatus(${m.id},'doing')">Đang xử lý</button>` : "") +
        (st !== "done" ? `<button class="small ghost" onclick="setStatus(${m.id},'done')">Đã xong</button>` : "") +
        (st !== "open" ? `<button class="small ghost" onclick="setStatus(${m.id},'open')">Mở lại</button>` : "") +
        `</div>`;
    }
    div.innerHTML = html;
    box.appendChild(div);
  }
  // Dang o gan cuoi (hoac vua mo phong) thi bam sat tin moi nhat; dang doc
  // do o tren thi giu nguyen doan dang doc, tin moi chi cong chieu cao o duoi.
  if (stickBottom) box.scrollTop = box.scrollHeight;
  else box.scrollTop = Math.max(0, prevTop + (box.scrollHeight - prevH));
  updateJumpBtn();
}
function renderMessages(list, reset) {
  if (reset) { msgList = []; lastId = 0; }
  for (const m of list) { lastId = Math.max(lastId, m.id); msgList.push(m); }
  renderAll();
}
async function loadMessages(reset) { try { const d = await api("/api/team/messages?after=" + (reset ? 0 : lastId)); renderMessages(d.messages, reset); } catch { showLogin(); } }
window.setStatus = async (id, status) => {
  try { await api("/api/team/status", { method: "POST", body: JSON.stringify({ id, status }) }); loadMessages(true); }
  catch (e) { alert(e.message); }
};
$("onlyOpen").addEventListener("change", () => { stickBottom = true; renderAll(); });
$("msgs").addEventListener("scroll", () => {
  const box = $("msgs");
  stickBottom = (box.scrollHeight - box.scrollTop - box.clientHeight) < 120;
  updateJumpBtn();
});
$("jumpBtn").onclick = () => {
  stickBottom = true;
  const box = $("msgs");
  box.scrollTo({ top: box.scrollHeight, behavior: "smooth" });
  updateJumpBtn();
};
$("mentionBtn").onclick = () => {
  const n = $("mentionSel").value; if (!n) return;
  const ta = $("composer");
  ta.value = (ta.value ? ta.value.replace(/\s*$/, " ") : "") + "@" + n + " ";
  ta.focus();
};
// Bo chon @mention ngay trong o soan (bo chot 18:49 13/11): go "@" o dau dong
// hoac sau khoang trang -> dropdown #mentionPop hien ngay tren o soan; go tiep
// thi loc theo chu do; cham/click, Enter/Tab de chon; mui ten len/xuong de di
// chuyen; Esc dong. Muc dau "Tat ca moi nguoi" chen "@Tất cả mọi người " —
// server (messages.js) trich thanh mentions = toan bo thanh vien.
let mpOpen = false, mpItems = [], mpActive = 0, mpStart = -1, mpQuery = null;
const ALL_MENTION_LABEL = "Tất cả mọi người";
function mentionContext() {
  const ta = $("composer");
  const pos = ta.selectionStart == null ? ta.value.length : ta.selectionStart;
  const m = ta.value.slice(0, pos).match(/(^|\s)@([^\s@]*)$/);
  if (!m) return null;
  return { start: pos - m[2].length - 1, query: m[2] };
}
function buildMentionItems(query) {
  const q = query.toLowerCase();
  const items = [];
  if (!q || ALL_MENTION_LABEL.toLowerCase().includes(q)) items.push({ label: "📣 " + ALL_MENTION_LABEL, insert: "@" + ALL_MENTION_LABEL + " " });
  for (const n of memberNames) {
    if (!q || n.toLowerCase().includes(q)) items.push({ label: "@" + n, insert: "@" + n + " " });
  }
  return items;
}
function renderMentionPop() {
  const pop = $("mentionPop");
  pop.innerHTML = "";
  if (!mpOpen || !mpItems.length) { pop.hidden = true; return; }
  mpItems.forEach((it, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "mp-item" + (i === mpActive ? " active" : "");
    b.textContent = it.label;
    b.addEventListener("mousedown", (e) => e.preventDefault()); // giu focus + con tro trong o soan khi cham chon
    b.addEventListener("click", () => pickMention(i));
    pop.appendChild(b);
  });
  pop.hidden = false;
  const act = pop.children[mpActive];
  if (act) act.scrollIntoView({ block: "nearest" });
}
function closeMentionPop() {
  mpOpen = false; mpItems = []; mpActive = 0; mpQuery = null;
  const pop = $("mentionPop");
  pop.hidden = true; pop.innerHTML = "";
}
function updateMentionPop() {
  const ctx = mentionContext();
  if (!ctx) { closeMentionPop(); return; }
  mpStart = ctx.start;
  if (ctx.query !== mpQuery) { mpQuery = ctx.query; mpActive = 0; }
  mpItems = buildMentionItems(ctx.query);
  if (!mpItems.length) { closeMentionPop(); return; }
  mpOpen = true;
  if (mpActive >= mpItems.length) mpActive = 0;
  renderMentionPop();
}
function pickMention(i) {
  const it = mpItems[i]; if (!it) return;
  const ta = $("composer");
  const pos = ta.selectionStart == null ? ta.value.length : ta.selectionStart;
  const before = ta.value.slice(0, mpStart);
  const after = ta.value.slice(pos);
  ta.value = before + it.insert + after;
  const caret = before.length + it.insert.length;
  closeMentionPop();
  ta.focus();
  ta.setSelectionRange(caret, caret);
}
$("composer").addEventListener("input", updateMentionPop);
$("composer").addEventListener("click", updateMentionPop);
$("composer").addEventListener("blur", () => setTimeout(closeMentionPop, 150));
$("loginBtn").onclick = async () => {
  $("loginErr").textContent = "";
  try {
    const name = $("loginName").value.trim(), code = $("loginCode").value.trim();
    const d = await api("/api/team/login", { method: "POST", body: JSON.stringify({ name, code }) });
    me = { name: d.name, role: d.role };
    saveCreds(name, code); // lưu trên máy này — lần sau tự vào, khỏi gõ lại
    const m = await api("/api/team/members"); showRoom(m.members);
  } catch (e) { $("loginErr").textContent = e.message; }
};
$("loginCode").addEventListener("keydown", (e) => { if (e.key === "Enter") $("loginBtn").click(); });
$("sendBtn").onclick = async () => {
  const v = $("composer").value.trim(); if (!v) return;
  const kind = $("asQuestion").checked ? "question" : "chat";
  $("composer").value = ""; $("asQuestion").checked = false; closeMentionPop();
  try { await api("/api/team/messages", { method: "POST", body: JSON.stringify({ body: v, kind }) }); stickBottom = true; loadMessages(false); }
  catch (e) { alert(e.message); }
};
$("composer").addEventListener("keydown", (e) => {
  if (mpOpen) {
    if (e.key === "ArrowDown") { e.preventDefault(); mpActive = Math.min(mpActive + 1, mpItems.length - 1); renderMentionPop(); return; }
    if (e.key === "ArrowUp") { e.preventDefault(); mpActive = Math.max(mpActive - 1, 0); renderMentionPop(); return; }
    if (e.key === "Enter" || e.key === "Tab") { e.preventDefault(); pickMention(mpActive); return; } // dropdown dang mo: Enter/Tab = chon, KHONG gui tin
    if (e.key === "Escape") { e.preventDefault(); closeMentionPop(); return; }
  }
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("sendBtn").click(); }
});
$("logoutBtn").onclick = async () => { await api("/api/team/logout", { method: "POST" }).catch(() => {}); clearCreds(); clearInterval(pollTimer); showLogin(); };
tryEnter();
</script>
</body>
</html>
